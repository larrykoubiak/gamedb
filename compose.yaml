x-database-environment: &database-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: "${PGDATABASE:-${POSTGRES_DB:-gamedb}}"
  PGUSER: "${PGUSER:-${POSTGRES_USER:-gamedb}}"
  PGPASSWORD: "${PGPASSWORD:-${POSTGRES_PASSWORD:?Set PGPASSWORD in .env}}"
  GAMEDB_LIBRETRO_THUMBNAILS: /data/libretro-thumbnails
  GAMEDB_MEDIA_INDEX: /data/media/cache/libretro-thumbnail-index.paths.gz
  GAMEDB_ROM_ROOT: /mnt/synology
  GAMEDB_API_KEY: "${GAMEDB_API_KEY:?Set GAMEDB_API_KEY in .env}"

services:
  db:
    image: postgres:16
    container_name: gamedb-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: "${PGDATABASE:-${POSTGRES_DB:-gamedb}}"
      POSTGRES_USER: "${PGUSER:-${POSTGRES_USER:-gamedb}}"
      POSTGRES_PASSWORD: "${PGPASSWORD:-${POSTGRES_PASSWORD:?Set PGPASSWORD in .env}}"
    ports:
      - "${GAMEDB_POSTGRES_PORT:-9876}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data

  explorer:
    build:
      context: .
      target: explorer
    container_name: gamedb-explorer
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *database-environment
      GAMEDB_PREVIEW_CACHE: /data/media/previews
      GAMEDB_SNES_MANUAL_ROOT: /mnt/snes-manuals
      GAMEDB_MEGADRIVE_MANUAL_ROOT: /mnt/megadrive-manuals
      GAMEDB_MASTERSYSTEM_MANUAL_ROOT: /mnt/mastersystem-manuals
      GAMEDB_PCENGINE_MANUAL_ROOT: /mnt/pcengine-manuals
      GAMEDB_N64_MANUAL_ROOT: /mnt/n64-manuals
      GAMEDB_SATURN_MANUAL_ROOT: /mnt/saturn-manuals
      GAMEDB_JAGUAR_MANUAL_ROOT: /mnt/jaguar-manuals
      GAMEDB_ATARI7800_MANUAL_ROOT: /mnt/atari7800-manuals
      GAMEDB_XEGS_MANUAL_ROOT: /mnt/xegs-manuals
      GAMEDB_CDI_MANUAL_ROOT: /mnt/cdi-manuals
      GAMEDB_PCFX_MANUAL_ROOT: /mnt/pcfx-manuals
      GAMEDB_CD32_MANUAL_ROOT: /mnt/cd32-manuals
      GAMEDB_CDTV_MANUAL_ROOT: /mnt/cdtv-manuals
      GAMEDB_3DO_MANUAL_ROOT: /mnt/3do-manuals
      GAMEDB_PLAYDIA_MANUAL_ROOT: /mnt/playdia-manuals
      GAMEDB_PIPPIN_MANUAL_ROOT: /mnt/pippin-manuals
      GAMEDB_DREAMCAST_MANUAL_ROOT: /mnt/dreamcast-manuals
      GAMEDB_PLAYSTATION2_MANUAL_ROOT: /mnt/playstation2-manuals
      GAMEDB_GAMECUBE_MANUAL_ROOT: /mnt/gamecube-manuals
      GAMEDB_NES_MANUAL_ROOT: /mnt/nes-manuals
      GAMEDB_PLAYSTATION_MANUAL_ROOT: /mnt/playstation-manuals
      GAMEDB_NEOGEO_MANUAL_ROOT: /mnt/neogeo-manuals
      GAMEDB_SECOND_GENERATION_MANUAL_ROOT: /mnt/second-generation-manuals
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GAMEDB_EXPLORER_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          # Preserve the origin name used by the existing managed tunnel.
          - web
    volumes:
      - ./data/media/launchbox:/data/media/launchbox
      - /mnt/exo:/mnt/exo:ro
      - ./data/media/previews:/data/media/previews
      - ./data/media/snes-translations:/app/data/media/snes-translations:ro
      - ./data/media/megadrive-translations:/app/data/media/megadrive-translations:ro
      - ./data/media/nes-translations:/app/data/media/nes-translations:ro
      - ./data/media/mastersystem-translations:/app/data/media/mastersystem-translations:ro
      - ./data/media/pcengine-translations:/app/data/media/pcengine-translations:ro
      - ./data/media/n64-translations:/app/data/media/n64-translations:ro
      - ./data/media/saturn-translations:/app/data/media/saturn-translations:ro
      - ./data/media/pcfx-translations:/app/data/media/pcfx-translations:ro
      - ./data/media/3do-translations:/app/data/media/3do-translations:ro
      - ./data/media/neogeo-translations:/app/data/media/neogeo-translations:ro
      - ./data/media/playstation-translations:/app/data/media/playstation-translations:ro
      - ./data/media/dreamcast-translations:/app/data/media/dreamcast-translations:ro
      - ./data/media/playstation2-translations:/app/data/media/playstation2-translations:ro
      - ./data/media/gamecube-translations:/app/data/media/gamecube-translations:ro
      - ./data/media/colecovision-translations:/app/data/media/colecovision-translations:ro
      - ./data/media/virtualboy-translations:/app/data/media/virtualboy-translations:ro
      - "${GAMEDB_VGM_HOST_ROOT:-/mnt/synology/music/VGM/By Format}:/mnt/vgm:ro"
      - "${GAMEDB_SNES_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/SNES}:/mnt/snes-manuals:ro"
      - "${GAMEDB_MEGADRIVE_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Mega Drive}:/mnt/megadrive-manuals:ro"
      - "${GAMEDB_MASTERSYSTEM_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Master System}:/mnt/mastersystem-manuals:ro"
      - "${GAMEDB_PCENGINE_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/PC Engine}:/mnt/pcengine-manuals:ro"
      - "${GAMEDB_N64_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Nintendo 64}:/mnt/n64-manuals:ro"
      - "${GAMEDB_SATURN_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Saturn}:/mnt/saturn-manuals:ro"
      - "${GAMEDB_JAGUAR_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Jaguar}:/mnt/jaguar-manuals:ro"
      - "${GAMEDB_ATARI7800_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Atari 7800}:/mnt/atari7800-manuals:ro"
      - "${GAMEDB_XEGS_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Atari XEGS}:/mnt/xegs-manuals:ro"
      - "${GAMEDB_CDI_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Philips CD-i}:/mnt/cdi-manuals:ro"
      - "${GAMEDB_PCFX_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/PC-FX}:/mnt/pcfx-manuals:ro"
      - "${GAMEDB_CD32_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Amiga CD32}:/mnt/cd32-manuals:ro"
      - "${GAMEDB_CDTV_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Commodore CDTV}:/mnt/cdtv-manuals:ro"
      - "${GAMEDB_3DO_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/3DO}:/mnt/3do-manuals:ro"
      - "${GAMEDB_PLAYDIA_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Bandai Playdia}:/mnt/playdia-manuals:ro"
      - "${GAMEDB_PIPPIN_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Apple Bandai Pippin}:/mnt/pippin-manuals:ro"
      - "${GAMEDB_DREAMCAST_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Sega Dreamcast}:/mnt/dreamcast-manuals:ro"
      - "${GAMEDB_PLAYSTATION2_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/PlayStation 2}:/mnt/playstation2-manuals:ro"
      - "${GAMEDB_GAMECUBE_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/GameCube}:/mnt/gamecube-manuals:ro"
      - "${GAMEDB_NES_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/NES}:/mnt/nes-manuals:ro"
      - "${GAMEDB_PLAYSTATION_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/PlayStation}:/mnt/playstation-manuals:ro"
      - "${GAMEDB_NEOGEO_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Neo Geo}:/mnt/neogeo-manuals:ro"
      - "${GAMEDB_SECOND_GENERATION_MANUAL_HOST_ROOT:-/mnt/synology/photo/Manuals/Second Generation}:/mnt/second-generation-manuals:ro"
      - ./data/libretro-thumbnails:/data/libretro-thumbnails:ro
      - /mnt/synology/roms:/mnt/synology/roms:ro
      - /mnt/synology/backup/games/Undub:/mnt/synology/backup/games/Undub:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gamedb-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN:-}"]
    depends_on:
      - explorer
    profiles: [public]

  deriver:
    build:
      context: .
      target: deriver
    container_name: gamedb-deriver
    env_file: .env
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/libretro-database:/data/libretro-database:ro
      - /mnt/synology/backup/games/Undub:/mnt/synology/backup/games/Undub:ro
    profiles: [tools]

  catalog-builder:
    build:
      context: .
      target: catalog-builder
    container_name: gamedb-catalog-builder
    env_file: .env
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/libretro-thumbnails:/data/libretro-thumbnails:ro
      - ./data/media/cache:/data/media/cache
      - ./data/media/playstation-translations:/app/data/media/playstation-translations
      - /mnt/synology/roms:/mnt/synology/roms:ro
      - /mnt/exo:/mnt/exo:ro
      - "${GAMEDB_VGM_HOST_ROOT:-/mnt/synology/music/VGM/By Format}:/mnt/vgm:ro"
    profiles: [tools]
