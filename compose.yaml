x-database-environment: &database-environment
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: "${PGDATABASE:-${POSTGRES_DB:-gamedb}}"
  PGUSER: "${PGUSER:-${POSTGRES_USER:-gamedb}}"
  PGPASSWORD: "${PGPASSWORD:-${POSTGRES_PASSWORD:?Set PGPASSWORD in .env}}"
  GAMEDB_LIBRETRO_THUMBNAILS: /data/libretro-thumbnails
  GAMEDB_MEDIA_INDEX: /data/media/cache/libretro-thumbnail-index.paths.gz
  GAMEDB_ROM_ROOT: /mnt/synology/roms

services:
  db:
    image: postgres:16
    container_name: gamedb-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: "${PGDATABASE:-${POSTGRES_DB:-gamedb}}"
      POSTGRES_USER: "${PGUSER:-${POSTGRES_USER:-gamedb}}"
      POSTGRES_PASSWORD: "${PGPASSWORD:-${POSTGRES_PASSWORD:?Set PGPASSWORD in .env}}"
    ports:
      - "${GAMEDB_POSTGRES_PORT:-9876}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data

  explorer:
    build:
      context: .
      target: explorer
    container_name: gamedb-explorer
    restart: unless-stopped
    env_file: .env
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GAMEDB_EXPLORER_PORT:-8000}:8000"
    networks:
      default:
        aliases:
          # Preserve the origin name used by the existing managed tunnel.
          - web
    volumes:
      - ./data/libretro-thumbnails:/data/libretro-thumbnails:ro
      - /mnt/synology/roms:/mnt/synology/roms:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gamedb-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN:-}"]
    depends_on:
      - explorer
    profiles: [public]

  deriver:
    build:
      context: .
      target: deriver
    container_name: gamedb-deriver
    env_file: .env
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/libretro-database:/data/libretro-database:ro
    profiles: [tools]

  catalog-builder:
    build:
      context: .
      target: catalog-builder
    container_name: gamedb-catalog-builder
    env_file: .env
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/libretro-thumbnails:/data/libretro-thumbnails:ro
      - ./data/media/cache:/data/media/cache
    profiles: [tools]
