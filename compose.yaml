services:
  explorer:
    build:
      context: .
      target: explorer
    container_name: gamedb-explorer
    env_file: .env
    ports:
      - "${GAMEDB_EXPLORER_PORT:-8000}:8000"

  deriver:
    build:
      context: .
      target: deriver
    container_name: gamedb-deriver
    env_file: .env
    profiles: [tools]

  catalog-builder:
    build:
      context: .
      target: catalog-builder
    container_name: gamedb-catalog-builder
    env_file: .env
    profiles: [tools]
