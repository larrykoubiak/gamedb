name: gamedb_catalog_projection

# Consumer projection begins only after the standalone deriver has produced a
# complete, usable derived schema.
layers:
  - name: catalog
    description: Project consumer systems, titles, and releases from derived data.
    steps:
      - name: build_catalog
        type: run_sql
        files:
          - sql/layers/catalog/010_schema_and_releases.sql
          - sql/layers/catalog/090_indexes_and_validation.sql

  - name: facts
    description: Normalize release attributes and retain their source evidence.
    steps:
      - name: build_release_facts
        type: run_sql
        files:
          - sql/layers/facts/010_schema.sql
          - sql/layers/facts/020_build.sql
          - sql/layers/facts/090_indexes_and_validation.sql

  - name: identity
    description: Reconcile titles using complete exact-content signatures.
    steps:
      - name: build_content_identity
        type: run_sql
        files:
          - sql/layers/identity/010_schema.sql
          - sql/layers/identity/020_build.sql
          - sql/layers/identity/090_indexes_and_validation.sql

  - name: software
    description: Resolve releases into evidence-backed platform software identities.
    steps:
      - name: build_software_identity
        type: run_sql
        files:
          - sql/layers/software/010_schema.sql
          - sql/layers/software/020_build.sql
          - sql/layers/software/090_indexes_and_validation.sql

  - name: scoring
    description: Apply user preferences and rank releases within software.
    steps:
      - name: build_release_scores
        type: run_sql
        files:
          - sql/layers/scoring/010_preferences.sql
          - sql/layers/scoring/020_generate_scores.sql
          - sql/layers/scoring/030_preferred_releases.sql
