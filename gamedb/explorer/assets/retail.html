<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retail catalog | GameDB</title>
  <link rel="stylesheet" href="/styles.css?v=21">
  <link rel="stylesheet" href="/retail.css?v=6">
  <link rel="stylesheet" href="/manual-reader.css">
  <script src="/vgm/player.js?v=7" defer></script>
  <script src="/vgm/soundtracks.js?v=4" defer></script>
  <script src="/artwork-viewer.js" defer></script>
  <script src="/manual-reader.js" defer></script>
  <script src="/retail.js?v=29" defer></script>
</head>
<body class="snes-page">
  <nav class="snes-topbar" aria-label="Catalog navigation">
    <a class="snes-brand" href="/" aria-label="GameDB retail catalogs">GameDB</a>
    <a id="snes-back" href="/" hidden>← Retail catalog</a>
    <a class="snes-archive" href="/archive">V1 archive</a>
  </nav>
  <main class="snes-catalog">
    <header class="snes-heading">
      <h1 id="snes-title" hidden>Retail catalog</h1>
      <div class="snes-browse-controls" hidden>
        <label class="snes-search">
          <span class="sr-only">Search games</span>
          <input id="snes-search" type="search" placeholder="Search by title" autocomplete="off">
        </label>
        <select id="snes-hardware" class="snes-hardware" aria-label="Hardware" hidden>
          <option value="">All hardware</option>
        </select>
        <select id="snes-genre" class="snes-genre" aria-label="Genre">
          <option value="">All genres</option>
        </select>
        <label class="snes-translation-filter" hidden>
          <input id="snes-translated" type="checkbox">
          Has translation
        </label>
        <nav class="pagination snes-pagination" aria-label="Catalog pages" hidden>
          <button type="button" data-page-step="-1" aria-label="Previous page" title="Previous page">←</button>
          <button type="button" data-page-step="1" aria-label="Next page" title="Next page">→</button>
        </nav>
      </div>
      <p id="snes-status" class="summary" role="status">Loading release catalog…</p>
    </header>
    <section id="snes-browse" hidden>
      <p id="snes-results" class="summary snes-search-status sr-only" role="status" tabindex="-1"></p>
      <ul id="snes-games" class="snes-games" role="list"></ul>
      <nav class="pagination snes-pagination snes-pagination-bottom" aria-label="Catalog pages at bottom" hidden>
        <button type="button" data-page-step="-1" aria-label="Previous page">←<span> Previous</span></button>
        <div class="snes-page-numbers"></div>
        <button type="button" data-page-step="1" aria-label="Next page"><span>Next </span>→</button>
      </nav>
    </section>
    <section id="snes-detail" hidden></section>
    <footer id="snes-source" class="snes-source" hidden>
      Release list adapted from <a id="snes-source-link"></a>.
      <a id="snes-source-license" hidden>CC BY-SA 4.0</a>
      <span id="snes-addon-sources"></span>
    </footer>
  </main>
  <dialog id="snes-rom-dialog" class="artwork-dialog snes-rom-dialog" aria-labelledby="snes-rom-title">
    <form id="snes-rom-form" method="dialog">
      <h2 id="snes-rom-title">Download translated ROM</h2>
      <label>GameDB API key
        <input id="snes-rom-key" type="password" required autocomplete="off" spellcheck="false">
      </label>
      <p id="snes-rom-status" role="status" hidden></p>
      <div class="snes-rom-actions">
        <button id="snes-rom-cancel" class="secondary-button" type="button">Cancel</button>
        <button id="snes-rom-submit" class="secondary-button" type="submit">Download ROM</button>
      </div>
    </form>
  </dialog>
  <dialog id="snes-manual-dialog" class="artwork-dialog snes-manual-dialog" aria-labelledby="snes-manual-title">
    <header class="artwork-heading">
      <h2 id="snes-manual-title"></h2>
      <div class="snes-manual-controls">
        <a id="snes-manual-file" class="secondary-button" target="_blank" rel="noopener noreferrer">Open PDF</a>
        <form method="dialog">
          <button class="icon-button" type="submit" aria-label="Close manual" autofocus>×</button>
        </form>
      </div>
    </header>
    <div class="snes-manual-stage">
      <div id="snes-manual-book" class="snes-manual-book" hidden></div>
      <div id="snes-manual-status" hidden>
        <p id="snes-manual-message" role="status"></p>
        <progress id="snes-manual-progress" aria-label="Manual pages ready" hidden></progress>
        <button id="snes-manual-retry" class="secondary-button" type="button" hidden>Try again</button>
      </div>
    </div>
    <nav id="snes-manual-navigation" class="artwork-navigation" aria-label="Manual pages" hidden>
      <button id="snes-manual-previous" class="secondary-button" type="button" aria-label="Previous manual page">← Previous</button>
      <span id="snes-manual-position" role="status"></span>
      <button id="snes-manual-next" class="secondary-button" type="button" aria-label="Next manual page">Next →</button>
    </nav>
  </dialog>
</body>
</html>
